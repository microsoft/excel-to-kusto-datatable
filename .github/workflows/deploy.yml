name: CI and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Skip lint, spell check, Zizmor, and tests (main only)"
        type: boolean
        default: false
      bypass_reason:
        description: "Required when skipping checks"
        type: string
        default: ""

permissions:
  contents: read

# Superseded PRs can be cancelled, but active main deployments must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && !inputs.skip_checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  spellcheck:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && !inputs.skip_checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run spell check
        run: npm run spellcheck

  zizmor:
    name: Run zizmor
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && !inputs.skip_checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true

  test:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && !inputs.skip_checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --ci

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          SKIP_CHECKS: ${{ inputs.skip_checks }}
          BYPASS_REASON: ${{ inputs.bypass_reason }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual deployments are only allowed from main."
            exit 1
          fi

          if [[ "$SKIP_CHECKS" == "true" && ! "$BYPASS_REASON" =~ [^[:space:]] ]]; then
            echo "::error::A nonblank bypass reason is required when skipping checks."
            exit 1
          fi

          {
            printf '## Manual deployment\n\n'
            printf -- '- Actor: `%s`\n- Commit: `%s`\n- Checks skipped: `%s`\n' \
              "$GITHUB_ACTOR" "$GITHUB_SHA" "$SKIP_CHECKS"
            if [[ "$SKIP_CHECKS" == "true" ]]; then
              printf '\n**Warning: lint, spell check, Zizmor, and unit tests were skipped.**\n'
              printf '\nBypass reason:\n\n'
              printf '%s\n' "$BYPASS_REASON" | sed 's/^/    /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Pages files
        run: |
          for file in taskpane.html taskpane.js manifest.xml \
            assets/icon-16.png assets/icon-32.png assets/icon-64.png assets/icon-80.png; do
            if [[ ! -s "dist/$file" ]]; then
              echo "::error::Missing or empty Pages file: dist/$file"
              exit 1
            fi
          done

      - name: Upload artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: [lint, spellcheck, zizmor, test, build]
    # Explicitly handle skipped checks without allowing a cancelled run to deploy.
    if: >-
      ${{
        !cancelled() &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        needs.build.result == 'success' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.skip_checks) ||
          (
            needs.lint.result == 'success' &&
            needs.spellcheck.result == 'success' &&
            needs.zizmor.result == 'success' &&
            needs.test.result == 'success'
          )
        )
      }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
